<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amit Hair Salon</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:
    linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.85)),
    radial-gradient(circle at center,#444,#111 70%);
}
.card{
  width:100%;
  max-width:500px;
  padding:35px 22px;
  border:1px solid #555;
  border-radius:25px;
  background:rgba(25,25,25,.9);
  box-shadow:0 0 35px rgba(255,255,255,.08);
}
.logo{
  font-size:55px;
  margin-bottom:10px;
}
h1{
  font-size:38px;
  margin-bottom:8px;
}
.tagline{
  color:#ddd;
  font-size:17px;
  margin-bottom:25px;
}
.info{
  background:#202020;
  border-radius:15px;
  padding:18px;
  margin:15px 0;
  line-height:1.7;
}
.btn{
  display:block;
  text-decoration:none;
  padding:15px;
  margin:12px 0;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
}
.call{
  background:#fff;
  color:#111;
}
.whatsapp{
  background:#25D366;
  color:white;
}
h2{
  margin-top:25px;
  margin-bottom:10px;
}
.footer{
  margin-top:25px;
  color:#aaa;
  font-size:13px;
}
</style>
</head>

<body>

<section class="hero">
  <div class="card">

    <div class="logo">✂️</div>

    <h1>Amit Hair Salon</h1>

    <p class="tagline">
      Stylish Haircut • Grooming • Modern Look
    </p>

    <div class="info">
      📍 <b>Location</b><br>
      Binaur Crossing, Hirasing<br>
      Binaur Chauki ke bagal
    </div>

    <div class="info">
      🕕 <b>Opening Time</b><br>
      Morning 6:00 AM – Night 9:00 PM
    </div>

    <h2>Contact Us</h2>

    <a class="btn call" href="tel:8081843261">
      📞 Call Now
    </a>

    <a class="btn whatsapp" href="https://wa.me/918081843261">
      💬 WhatsApp
    </a>

    <div class="footer">
      © 2026 Amit Hair Salon
    </div>

  </div>
</section>

</body>
</html>
